<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caster & Talent Lower Third Overlay</title>
    <link rel="stylesheet" href="../tungstenFont.css">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&display=swap');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: transparent !important;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            position: relative;
        }

        .caster-banner-container {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%) translateY(200px);
            opacity: 0;
            display: flex;
            gap: 20px;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .caster-banner-container.visible {
            transform: translateX(-50%) translateY(0px);
            opacity: 1;
        }

        .caster-card {
            background: rgba(16, 24, 36, 0.92);
            backdrop-filter: blur(12px);
            border-left: 4px solid #ff4655;
            border-right: 4px solid #00f2fe;
            border-radius: 8px;
            padding: 14px 28px;
            min-width: 320px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .caster-badge {
            background: linear-gradient(135deg, #ff4655, #d62828);
            color: #fff;
            font-size: 0.7rem;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .caster-info {
            display: flex;
            flex-direction: column;
        }

        .caster-name {
            color: #ffffff;
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .caster-handle {
            color: #00f2fe;
            font-size: 0.85rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div id="caster-container" class="caster-banner-container">
        <!-- Dynamically populated based on enabled caster slots -->
    </div>

    <script>
        let autoHideTimer = null;
        let autoLoopInterval = null;

        function showPopup(duration = 6000) {
            const container = document.getElementById('caster-container');
            if (autoHideTimer) {
                clearTimeout(autoHideTimer);
                autoHideTimer = null;
            }
            container.classList.add('visible');
            if (duration > 0) {
                autoHideTimer = setTimeout(() => {
                    container.classList.remove('visible');
                }, duration);
            }
        }

        function startLoop(duration = 6000, interval = 30000) {
            stopLoop();
            showPopup(duration);
            autoLoopInterval = setInterval(() => {
                showPopup(duration);
            }, interval + duration);
        }

        function stopLoop() {
            if (autoLoopInterval) {
                clearInterval(autoLoopInterval);
                autoLoopInterval = null;
            }
        }

        async function fetchCasters() {
            try {
                const res = await fetch('../get_casters');
                if (res.status === 200) {
                    const data = await res.json();
                    updateCasterDisplay(data);
                }
            } catch(e) {}
        }

        function buildCasterCardHTML(caster, index) {
            const themes = [
                { borderL: '#ff4655', borderR: '#00f2fe', badgeBg: 'linear-gradient(135deg, #ff4655, #d62828)', badgeColor: '#fff', handleColor: '#00f2fe' },
                { borderL: '#00f2fe', borderR: '#ff4655', badgeBg: 'linear-gradient(135deg, #00f2fe, #00b4d8)', badgeColor: '#000', handleColor: '#00f2fe' },
                { borderL: '#fde047', borderR: '#ff4655', badgeBg: 'linear-gradient(135deg, #fde047, #f59e0b)', badgeColor: '#000', handleColor: '#fde047' }
            ];
            const t = themes[index % themes.length];
            const name = (caster.name || `CASTER ${index + 1}`).toUpperCase();
            const handle = caster.handle || '';
            const role = (caster.role || (index === 0 ? 'TALENT' : (index === 1 ? 'ANALYST' : 'HOST'))).toUpperCase();

            return `
            <div class="caster-card" style="border-left-color: ${t.borderL}; border-right-color: ${t.borderR};">
                <div class="caster-badge" style="background: ${t.badgeBg}; color: ${t.badgeColor};">${role}</div>
                <div class="caster-info">
                    <span class="caster-name">${name}</span>
                    ${handle ? `<span class="caster-handle" style="color: ${t.handleColor};">${handle}</span>` : ''}
                </div>
            </div>`;
        }

        function updateCasterDisplay(data) {
            const container = document.getElementById('caster-container');
            if (!container || !data) return;

            let html = '';
            const slots = [data.caster_1, data.caster_2, data.caster_3];
            
            slots.forEach((c, idx) => {
                if (c && c.enabled !== false && (c.name || c.handle)) {
                    html += buildCasterCardHTML(c, idx);
                }
            });

            // Fallback if none explicitly enabled but caster_1 exists
            if (!html && data.caster_1 && data.caster_1.name) {
                html += buildCasterCardHTML(data.caster_1, 0);
            }

            container.innerHTML = html;

            const dur = data.duration || 6000;
            const intv = data.interval || 30000;

            if (data.auto_loop) {
                startLoop(dur, intv);
            } else {
                stopLoop();
                if (data.show_lower_third) {
                    showPopup(dur);
                } else {
                    if (autoHideTimer) {
                        clearTimeout(autoHideTimer);
                        autoHideTimer = null;
                    }
                    container.classList.remove('visible');
                }
            }
        }

        if (typeof io !== 'undefined') {
            const socket = io();
            socket.on('castersUpdate', (data) => {
                updateCasterDisplay(data);
            });
        }

        fetchCasters();
    </script>
</body>
</html>
