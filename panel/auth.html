<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZENX TOURNAMENT OVERLAY HOST - Admin Auth</title>
    <link rel="stylesheet" href="../resources/css/admin.css">
    <link rel="stylesheet" href="../resources/css/auth.css">
    <link rel="stylesheet" href="../resources/css/alerts.css">
    <script src="../resources/js/auth.js" defer></script>
    <script src="../resources/js/alerts.js" defer></script>
    <script src="https://kit.fontawesome.com/1061ea1575.js" crossorigin="anonymous"></script>
</head>
<body style="align-items: center; justify-content: center;">
    
    <div style="max-width: 440px; width: 100%; padding: 36px; background: rgba(20, 24, 36, 0.92); backdrop-filter: blur(16px); border: 1px solid var(--panel-border); border-radius: var(--radius-lg); box-shadow: 0 15px 40px rgba(0,0,0,0.6); text-align: center;">
        <img src="../visual_assets/ZENX_RED.png" alt="ZENX Logo" style="height: 72px; margin-bottom: 16px; border-radius: 8px; filter: drop-shadow(0 0 12px rgba(255,70,85,0.6));">
        <h2 style="font-family: var(--font-display); font-size: 1.8rem; letter-spacing: 1px; color: #fff; margin-bottom: 6px;">ZENX ADMIN AUTH</h2>
        <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 24px;">Enter password to access live tournament stream controls.</p>

        <form id="login-form" onsubmit="event.preventDefault();">
            <div style="position: relative; margin-bottom: 20px;">
                <input id="pw-input" type="password" placeholder="Enter Admin Password..." class="input-field" style="padding-left: 42px;">
                <i class="fa-solid fa-lock" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
            </div>
            <button id="pw-submit" type="button" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 1rem;">
                <i class="fa-solid fa-right-to-bracket"></i> Login Dashboard
            </button>
        </form>

        <div style="margin-top: 24px; font-size: 0.85rem;">
            <a href="../" style="color: var(--accent-secondary); text-decoration: none;"><i class="fa-solid fa-arrow-left"></i> Back to Overlay Portal</a>
        </div>
    </div>

</body>
</html>
